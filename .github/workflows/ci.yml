name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Root install; the postinstall script installs the ui project too.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck UI
        run: pnpm --dir ui exec tsc --noEmit

      - name: Test UI
        run: pnpm --dir ui test

      # Tauri's frontendDist (../ui/dist) must exist for the Rust build.
      - name: Build frontend
        run: pnpm --dir ui exec vite build

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --lib
